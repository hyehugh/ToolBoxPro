<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TETRIS · 俄罗斯方块</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0a1a;
    --panel-bg: rgba(15, 15, 35, 0.85);
    --border-glow: rgba(100, 200, 255, 0.3);
    --text: #e0e8ff;
    --text-dim: #6a7a9a;
    --accent: #00e5ff;
    --accent2: #ff4081;
    --grid-line: rgba(100, 200, 255, 0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(0, 229, 255, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 50%, rgba(255, 64, 129, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(100, 100, 255, 0.05) 0%, transparent 40%);
    z-index: 0;
    animation: bgPulse 8s ease-in-out infinite alternate;
  }

  @keyframes bgPulse {
    0% { opacity: 0.7; }
    100% { opacity: 1; }
  }

  .game-wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 24px;
    align-items: flex-start;
    padding: 20px;
  }

  /* Side panels */
  .side-panel {
    width: 160px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-box {
    background: var(--panel-bg);
    border: 1px solid var(--border-glow);
    border-radius: 12px;
    padding: 16px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.05), inset 0 0 30px rgba(0, 229, 255, 0.02);
  }

  .panel-box h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 10px;
    text-align: center;
  }

  .panel-box .value {
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    font-weight: 900;
    text-align: center;
    background: linear-gradient(135deg, var(--accent), #80d0ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .panel-box .value.score {
    font-size: 20px;
  }

  .panel-box .value.level {
    font-size: 28px;
  }

  .panel-box .value.lines {
    font-size: 20px;
  }

  /* Next piece preview */
  #next-canvas, #hold-canvas {
    display: block;
    margin: 0 auto;
  }

  /* Game board */
  .board-container {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow:
      0 0 60px rgba(0, 229, 255, 0.1),
      0 0 120px rgba(0, 229, 255, 0.05),
      0 20px 60px rgba(0, 0, 0, 0.5);
  }

  #game-canvas {
    display: block;
    background: rgba(5, 5, 20, 0.9);
  }

  /* Overlay screens */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5, 5, 20, 0.85);
    backdrop-filter: blur(8px);
    z-index: 10;
    transition: opacity 0.3s;
  }

  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .overlay h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 48px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    letter-spacing: 4px;
  }

  .overlay .subtitle {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 32px;
  }

  .overlay .final-score {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    color: var(--accent);
    margin-bottom: 24px;
  }

  .btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    padding: 14px 40px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: rgba(0, 229, 255, 0.1);
    color: var(--accent);
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .btn:hover {
    background: rgba(0, 229, 255, 0.25);
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
    transform: translateY(-2px);
  }

  .btn:active {
    transform: translateY(0);
  }

  /* Controls info */
  .controls-info {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 2;
  }

  .controls-info kbd {
    display: inline-block;
    background: rgba(0, 229, 255, 0.1);
    border: 1px solid rgba(0, 229, 255, 0.2);
    border-radius: 4px;
    padding: 2px 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    color: var(--accent);
    min-width: 28px;
    text-align: center;
  }

  /* Line clear animation flash */
  .line-clear-flash {
    position: absolute;
    left: 0;
    width: 100%;
    height: 30px;
    background: white;
    z-index: 5;
    animation: flashLine 0.4s ease-out forwards;
    pointer-events: none;
  }

  @keyframes flashLine {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Combo text */
  .combo-text {
    position: absolute;
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0, 229, 255, 0.8);
    z-index: 6;
    pointer-events: none;
    animation: comboFloat 1s ease-out forwards;
  }

  @keyframes comboFloat {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    50% { opacity: 1; transform: translateY(-30px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
  }

  /* Mobile controls */
  .mobile-controls {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    padding: 10px;
    background: linear-gradient(to top, rgba(5,5,20,0.95), transparent);
    padding-top: 30px;
  }

  .mobile-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .mobile-btn {
    width: 60px;
    height: 50px;
    border-radius: 10px;
    border: 1px solid var(--border-glow);
    background: rgba(15, 15, 35, 0.8);
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .mobile-btn:active {
    background: rgba(0, 229, 255, 0.3);
  }

  .mobile-btn.wide {
    width: 130px;
    font-size: 14px;
    letter-spacing: 1px;
  }

  @media (max-width: 768px) {
    .game-wrapper {
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 10px;
      padding-bottom: 200px;
    }
    .side-panel {
      flex-direction: row;
      width: 100%;
      justify-content: center;
    }
    .panel-box {
      padding: 10px 14px;
    }
    .controls-info { display: none; }
    .mobile-controls { display: block; }
    #game-canvas {
      width: calc(100vw - 20px) !important;
      height: calc((100vw - 20px) * 2) !important;
    }
    .board-container {
      border-radius: 10px;
    }
    .overlay h1 { font-size: 32px; }
  }

  /* Particles */
  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--accent);
    border-radius: 50%;
    pointer-events: none;
    z-index: 4;
    animation: particleFade 0.8s ease-out forwards;
  }

  @keyframes particleFade {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
  }
</style>
</head>
<body>

<div class="game-wrapper">
  <!-- Left panel -->
  <div class="side-panel">
    <div class="panel-box">
      <h3>Hold</h3>
      <canvas id="hold-canvas" width="80" height="60"></canvas>
    </div>
    <div class="panel-box">
      <h3>Score</h3>
      <div class="value score" id="score-display">0</div>
    </div>
    <div class="panel-box">
      <h3>Level</h3>
      <div class="value level" id="level-display">1</div>
    </div>
    <div class="panel-box">
      <h3>Lines</h3>
      <div class="value lines" id="lines-display">0</div>
    </div>
  </div>

  <!-- Game board -->
  <div class="board-container" id="board-container">
    <canvas id="game-canvas"></canvas>
    <!-- Start overlay -->
    <div class="overlay" id="start-overlay">
      <h1>TETRIS</h1>
      <p class="subtitle">经典俄罗斯方块</p>
      <button class="btn" id="start-btn">开始游戏</button>
    </div>
    <!-- Pause overlay -->
    <div class="overlay hidden" id="pause-overlay">
      <h1>PAUSED</h1>
      <p class="subtitle">游戏暂停</p>
      <button class="btn" id="resume-btn">继续游戏</button>
    </div>
    <!-- Game over overlay -->
    <div class="overlay hidden" id="gameover-overlay">
      <h1>GAME OVER</h1>
      <p class="final-score" id="final-score">得分: 0</p>
      <button class="btn" id="restart-btn">再来一局</button>
    </div>
  </div>

  <!-- Right panel -->
  <div class="side-panel">
    <div class="panel-box">
      <h3>Next</h3>
      <canvas id="next-canvas" width="80" height="180"></canvas>
    </div>
    <div class="panel-box">
      <h3>Controls</h3>
      <div class="controls-info">
        <kbd>←</kbd><kbd>→</kbd> 移动<br>
        <kbd>↑</kbd> 旋转<br>
        <kbd>↓</kbd> 加速下落<br>
        <kbd>Space</kbd> 硬降<br>
        <kbd>C</kbd> 暂存<br>
        <kbd>P</kbd> 暂停<br>
      </div>
    </div>
  </div>
</div>

<!-- Mobile controls -->
<div class="mobile-controls">
  <div class="mobile-row">
    <div class="mobile-btn" data-action="rotate">↻</div>
  </div>
  <div class="mobile-row">
    <div class="mobile-btn" data-action="left">←</div>
    <div class="mobile-btn" data-action="down">↓</div>
    <div class="mobile-btn" data-action="right">→</div>
  </div>
  <div class="mobile-row">
    <div class="mobile-btn wide" data-action="drop">硬降</div>
    <div class="mobile-btn wide" data-action="hold">暂存</div>
  </div>
</div>

<script>
// ============ TETRIS ENGINE ============
const COLS = 10;
const ROWS = 20;
const BLOCK = 30;

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
canvas.width = COLS * BLOCK;
canvas.height = ROWS * BLOCK;

const nextCanvas = document.getElementById('next-canvas');
const nextCtx = nextCanvas.getContext('2d');
const holdCanvas = document.getElementById('hold-canvas');
const holdCtx = holdCanvas.getContext('2d');

// Tetromino definitions with colors
const PIECES = {
  I: { shape: [[0,0],[1,0],[2,0],[3,0]], color: '#00e5ff' },
  O: { shape: [[0,0],[1,0],[0,1],[1,1]], color: '#ffeb3b' },
  T: { shape: [[0,0],[1,0],[2,0],[1,1]], color: '#aa00ff' },
  S: { shape: [[1,0],[2,0],[0,1],[1,1]], color: '#76ff03' },
  Z: { shape: [[0,0],[1,0],[1,1],[2,1]], color: '#ff1744' },
  J: { shape: [[0,0],[0,1],[1,1],[2,1]], color: '#2979ff' },
  L: { shape: [[2,0],[0,1],[1,1],[2,1]], color: '#ff9100' }
};

const PIECE_NAMES = ['I','O','T','S','Z','J','L'];

// SRS rotation data
const SRS_DATA = {
  I: { '0→R': [[-1,0],[0,0],[1,0],[2,0]], 'R→B': [[1,0],[2,0],[3,0],[4,0]], 'B→L': [[1,0],[0,0],[-1,0],[-2,0]], 'L→0': [[-1,0],[0,0],[1,0],[2,0]] },
  O: { '0→R': [[0,0],[0,0],[0,0],[0,0]], 'R→B': [[0,0],[0,0],[0,0],[0,0]], 'B→L': [[0,0],[0,0],[0,0],[0,0]], 'L→0': [[0,0],[0,0],[0,0],[0,0]] },
  T: { '0→R': [[0,0],[1,0],[1,1],[1,-1]], 'R→B': [[0,0],[-1,0],[-1,-1],[-1,1]], 'B→L': [[0,0],[-1,0],[0,1],[0,-1]], 'L→0': [[0,0],[1,0],[0,-1],[0,1]] },
  S: { '0→R': [[1,0],[2,0],[0,1],[1,1]], 'R→B': [[0,0],[1,0],[0,-1],[1,-1]], 'B→L': [[-1,0],[0,0],[-1,1],[0,1]], 'L→0': [[0,0],[-1,0],[0,-1],[-1,-1]] },
  Z: { '0→R': [[0,0],[-1,0],[0,1],[-1,1]], 'R→B': [[0,0],[1,0],[0,-1],[1,-1]], 'B→L': [[0,0],[1,0],[0,1],[1,1]], 'L→0': [[0,0],[-1,0],[0,-1],[-1,-1]] },
  J: { '0→R': [[0,0],[0,1],[0,-1],[1,-1]], 'R→B': [[0,0],[-1,0],[-1,-1],[-2,-1]], 'B→L': [[0,0],[0,1],[0,-1],[-1,-1]], 'L→0': [[0,0],[1,0],[1,-1],[2,-1]] },
  L: { '0→R': [[0,0],[0,-1],[0,1],[1,1]], 'R→B': [[0,0],[-1,0],[-1,1],[-2,1]], 'B→L': [[0,0],[0,-1],[0,1],[1,1]], 'L→0': [[0,0],[1,0],[1,1],[2,1]] }
};

// Game state
let board = [];
let currentPiece = null;
let holdPiece = null;
let canHold = true;
let nextPieces = [];
let score = 0;
let level = 1;
let lines = 0;
let gameRunning = false;
let gamePaused = false;
let dropTimer = null;
let lastTime = 0;
let dropCounter = 0;
let lockDelay = 0;
let lockDelayMax = 500;
let animating = false;

// Scoring
const SCORE_TABLE = { 1: 100, 2: 300, 3: 500, 4: 800 };
const SOFT_DROP_SCORE = 1;
const HARD_DROP_SCORE = 2;

// 7-bag randomizer
let bag = [];
function getNextPieceName() {
  if (bag.length === 0) {
    bag = [...PIECE_NAMES].sort(() => Math.random() - 0.5);
  }
  return bag.pop();
}

function fillNextPieces() {
  while (nextPieces.length < 3) {
    nextPieces.push(getNextPieceName());
  }
}

function getShape(name, rotation = 0) {
  const piece = PIECES[name];
  if (rotation === 0) return piece.shape.map(p => [...p]);
  const key = `${rotation === 1 ? '0→R' : rotation === 2 ? 'R→B' : 'B→L'}`;
  const offset = SRS_DATA[name][key];
  return piece.shape.map((p, i) => [p[0] + offset[i][0], p[1] + offset[i][1]]);
}

function createPiece(name) {
  const shape = getShape(name, 0);
  return {
    name,
    shape: shape.map(p => [...p]),
    rotation: 0,
    x: Math.floor(COLS / 2) - 2,
    y: -2
  };
}

function initBoard() {
  board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

function isValid(shape, offX, offY) {
  for (const [bx, by] of shape) {
    const nx = bx + offX;
    const ny = by + offY;
    if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
    if (ny >= 0 && board[ny][nx]) return false;
  }
  return true;
}

function lockPiece() {
  for (const [bx, by] of currentPiece.shape) {
    const nx = bx + currentPiece.x;
    const ny = by + currentPiece.y;
    if (ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS) {
      board[ny][nx] = currentPiece.color;
    }
  }
  canHold = true;
  clearLines();
  spawnPiece();
}

function clearLines() {
  let cleared = 0;
  const toClear = [];

  for (let y = ROWS - 1; y >= 0; y--) {
    if (board[y].every(cell => cell !== null)) {
      toClear.push(y);
    }
  }

  if (toClear.length > 0) {
    cleared = toClear.length;

    // Flash animation
    toClear.forEach(y => {
      const flash = document.createElement('div');
      flash.className = 'line-clear-flash';
      flash.style.top = (y * BLOCK + canvas.parentElement.offsetTop) + 'px';
      document.getElementById('board-container').appendChild(flash);
      setTimeout(() => flash.remove(), 500);
    });

    // Spawn particles
    toClear.forEach(y => {
      for (let x = 0; x < COLS; x++) {
        spawnParticle(x * BLOCK + BLOCK/2, y * BLOCK + BLOCK/2, board[y][x]);
      }
    });

    // Remove lines
    toClear.sort((a,b) => a-b).forEach(y => {
      board.splice(y, 1);
      board.unshift(Array(COLS).fill(null));
    });

    // Score
    const pts = (SCORE_TABLE[cleared] || 0) * level;
    score += pts;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;

    // Combo text
    if (cleared >= 2) {
      showCombo(cleared);
    }

    updateDisplay();
  }
}

function showCombo(count) {
  const container = document.getElementById('board-container');
  const names = ['', 'Single', 'Double', 'Triple', 'TETRIS!'];
  const text = document.createElement('div');
  text.className = 'combo-text';
  text.textContent = names[count] || `${count}x Combo!`;
  text.style.left = '50%';
  text.style.top = '40%';
  text.style.transform = 'translateX(-50%)';
  container.appendChild(text);
  setTimeout(() => text.remove(), 1200);
}

function spawnPiece() {
  fillNextPieces();
  const name = nextPieces.shift();
  fillNextPieces();
  currentPiece = createPiece(name);
  lockDelay = 0;

  if (!isValid(currentPiece.shape, currentPiece.x, currentPiece.y)) {
    gameOver();
  }
}

function getGhostY() {
  let gy = currentPiece.y;
  while (isValid(currentPiece.shape, currentPiece.x, gy + 1)) {
    gy++;
  }
  return gy;
}

function move(dx, dy) {
  if (isValid(currentPiece.shape, currentPiece.x + dx, currentPiece.y + dy)) {
    currentPiece.x += dx;
    currentPiece.y += dy;
    if (dy > 0) dropCounter = 0;
    return true;
  }
  return false;
}

function rotate() {
  const nextRot = (currentPiece.rotation + 1) % 4;
  const shape = getShape(currentPiece.name, nextRot);
  const kicks = SRS_DATA[currentPiece.name][`${currentPiece.rotation === 0 ? '0→R' : currentPiece.rotation === 1 ? 'R→B' : 'B→L'}`];

  // Try wall kicks
  const kicks2 = [0, -1, 1, -2, 2];
  for (const kx of kicks2) {
    for (const ky of [0, -1, 1]) {
      if (isValid(shape.map(([sx, sy]) => [sx + currentPiece.x + kx, sy + currentPiece.y + ky]), 0, 0)) {
        currentPiece.shape = shape.map(([sx, sy]) => [sx + kx, sy + ky]);
        currentPiece.rotation = nextRot;
        lockDelay = 0;
        return;
      }
    }
  }
}

function hardDrop() {
  let dropped = 0;
  while (move(0, 1)) dropped++;
  score += dropped * HARD_DROP_SCORE;
  updateDisplay();
  lockPiece();
}

function holdCurrentPiece() {
  if (!canHold) return;
  canHold = false;
  const name = currentPiece.name;
  if (holdPiece) {
    const tmp = holdPiece;
    holdPiece = name;
    currentPiece = createPiece(tmp);
  } else {
    holdPiece = name;
    spawnPiece();
  }
}

function getDropSpeed() {
  // Speed curve: starts at 800ms, decreases with level
  return Math.max(50, 800 - (level - 1) * 70);
}

function updateDisplay() {
  document.getElementById('score-display').textContent = score.toLocaleString();
  document.getElementById('level-display').textContent = level;
  document.getElementById('lines-display').textContent = lines;
}

// ============ RENDERING ============
function drawBlock(context, x, y, color, size = BLOCK, alpha = 1) {
  const px = x * size;
  const py = y * size;
  const inset = 2;

  context.globalAlpha = alpha;

  // Main block
  const grad = context.createLinearGradient(px, py, px + size, py + size);
  grad.addColorStop(0, lightenColor(color, 30));
  grad.addColorStop(1, color);
  context.fillStyle = grad;
  context.fillRect(px + inset, py + inset, size - inset * 2, size - inset * 2);

  // Highlight
  context.fillStyle = 'rgba(255,255,255,0.15)';
  context.fillRect(px + inset, py + inset, size - inset * 2, 3);
  context.fillRect(px + inset, py + inset, 3, size - inset * 2);

  // Shadow
  context.fillStyle = 'rgba(0,0,0,0.2)';
  context.fillRect(px + inset, py + size - inset - 3, size - inset * 2, 3);
  context.fillRect(px + size - inset - 3, py + inset, 3, size - inset * 2);

  // Inner glow
  context.fillStyle = 'rgba(255,255,255,0.05)';
  context.fillRect(px + inset + 4, py + inset + 4, size - inset * 2 - 8, size - inset * 2 - 8);

  context.globalAlpha = 1;
}

function lightenColor(hex, amount) {
  const r = Math.min(255, parseInt(hex.slice(1,3), 16) + amount);
  const g = Math.min(255, parseInt(hex.slice(3,5), 16) + amount);
  const b = Math.min(255, parseInt(hex.slice(5,7), 16) + amount);
  return `rgb(${r},${g},${b})`;
}

function drawBoard() {
  // Clear
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grid lines
  ctx.strokeStyle = 'rgba(100, 200, 255, 0.04)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * BLOCK, 0);
    ctx.lineTo(x * BLOCK, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * BLOCK);
    ctx.lineTo(canvas.width, y * BLOCK);
    ctx.stroke();
  }

  // Placed blocks
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (board[y][x]) {
        drawBlock(ctx, x, y, board[y][x]);
      }
    }
  }

  if (!currentPiece || animating) return;

  // Ghost piece
  const ghostY = getGhostY();
  if (ghostY !== currentPiece.y) {
    for (const [bx, by] of currentPiece.shape) {
      const gx = bx + currentPiece.x;
      const gy = by + ghostY;
      if (gy >= 0 && gy < ROWS && gx >= 0 && gx < COLS) {
        drawBlock(ctx, gx, gy, currentPiece.color, BLOCK, 0.15);
      }
    }
  }

  // Current piece
  for (const [bx, by] of currentPiece.shape) {
    const px = bx + currentPiece.x;
    const py = by + currentPiece.y;
    if (py >= 0 && py < ROWS && px >= 0 && px < COLS) {
      drawBlock(ctx, px, py, currentPiece.color);
    }
  }
}

function drawPreview(context, canvasEl, pieceName, blockSize = 18) {
  context.clearRect(0, 0, canvasEl.width, canvasEl.height);
  if (!pieceName) return;

  const piece = PIECES[pieceName];
  const shape = getShape(pieceName, 0);

  // Calculate bounds
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const [x, y] of shape) {
    minX = Math.min(minX, x);
    maxX = Math.max(maxX, x);
    minY = Math.min(minY, y);
    maxY = Math.max(maxY, y);
  }
  const w = maxX - minX + 1;
  const h = maxY - minY + 1;

  // Center
  const offsetX = (canvasEl.width / blockSize - w) / 2 - minX;
  const offsetY = (canvasEl.height / blockSize - h) / 2 - minY;

  for (const [bx, by] of shape) {
    drawBlock(context, bx + offsetX, by + offsetY, piece.color, blockSize);
  }
}

// ============ PARTICLES ============
function spawnParticle(x, y, color) {
  const container = document.getElementById('board-container');
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = x + 'px';
  p.style.top = y + 'px';
  p.style.background = color || '#00e5ff';
  const dx = (Math.random() - 0.5) * 60;
  const dy = (Math.random() - 0.5) * 60 - 20;
  p.style.setProperty('--dx', dx + 'px');
  p.style.setProperty('--dy', dy + 'px');
  container.appendChild(p);
  setTimeout(() => p.remove(), 900);
}

// ============ GAME LOOP ============
function gameLoop(timestamp) {
  if (!gameRunning || gamePaused) return;

  const delta = timestamp - lastTime;
  lastTime = timestamp;
  dropCounter += delta;

  const speed = getDropSpeed();

  if (dropCounter >= speed) {
    if (!move(0, 1)) {
      lockDelay += dropCounter;
      if (lockDelay >= lockDelayMax) {
        lockPiece();
        lockDelay = 0;
      }
    } else {
      lockDelay = 0;
    }
    dropCounter = 0;
  }

  drawBoard();
  requestAnimationFrame(gameLoop);
}

// ============ CONTROLS ============
const keys = {};
let dasTimer = {};
const DAS_DELAY = 170;
const DAS_RATE = 50;

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;

  if (e.key === 'p' || e.key === 'P') {
    togglePause();
    return;
  }

  if (!gameRunning || gamePaused) return;

  switch(e.key) {
    case 'ArrowLeft':
      e.preventDefault();
      move(-1, 0);
      dasTimer.left = { time: 0, active: true };
      break;
    case 'ArrowRight':
      e.preventDefault();
      move(1, 0);
      dasTimer.right = { time: 0, active: true };
      break;
    case 'ArrowDown':
      e.preventDefault();
      if (move(0, 1)) {
        score += SOFT_DROP_SCORE;
        dropCounter = 0;
        updateDisplay();
      }
      break;
    case 'ArrowUp':
      e.preventDefault();
      rotate();
      break;
    case ' ':
      e.preventDefault();
      hardDrop();
      break;
    case 'c': case 'C':
      holdCurrentPiece();
      break;
  }
});

document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft') delete dasTimer.left;
  if (e.key === 'ArrowRight') delete dasTimer.right;
});

// DAS (Delayed Auto Shift)
setInterval(() => {
  if (!gameRunning || gamePaused) return;
  for (const dir of ['left', 'right']) {
    const t = dasTimer[dir];
    if (!t || !t.active) continue;
    t.time += 50;
    if (t.time >= DAS_DELAY) {
      if ((t.time - DAS_DELAY) % DAS_RATE < 50) {
        move(dir === 'left' ? -1 : 1, 0);
      }
    }
  }
}, 50);

// ============ GAME STATE ============
function startGame() {
  initBoard();
  score = 0;
  level = 1;
  lines = 0;
  holdPiece = null;
  canHold = true;
  nextPieces = [];
  bag = [];
  animating = false;
  dropCounter = 0;
  lockDelay = 0;

  fillNextPieces();
  spawnPiece();
  updateDisplay();

  gameRunning = true;
  gamePaused = false;
  lastTime = performance.now();

  document.getElementById('start-overlay').classList.add('hidden');
  document.getElementById('gameover-overlay').classList.add('hidden');
  document.getElementById('pause-overlay').classList.add('hidden');

  drawPreview(nextCtx, nextCanvas, nextPieces[0]);
  drawPreview(nextCtx, nextCanvas, nextPieces[1], 14);
  drawPreview(nextCtx, nextCanvas, nextPieces[2], 14);

  requestAnimationFrame(gameLoop);
}

function togglePause() {
  if (!gameRunning) return;
  gamePaused = !gamePaused;
  if (gamePaused) {
    document.getElementById('pause-overlay').classList.remove('hidden');
  } else {
    document.getElementById('pause-overlay').classList.add('hidden');
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
  }
}

function gameOver() {
  gameRunning = false;
  document.getElementById('final-score').textContent = `得分: ${score.toLocaleString()}`;
  document.getElementById('gameover-overlay').classList.remove('hidden');

  // Animate remaining blocks
  animateGameOver();
}

function animateGameOver() {
  let delay = 0;
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (board[y][x]) {
        const block = board[y][x];
        board[y][x] = null;
        setTimeout(() => {
          board[y][x] = block;
          drawBoard();
        }, delay);
        delay += 30;
      }
    }
  }
}

// ============ EVENT LISTENERS ============
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('resume-btn').addEventListener('click', togglePause);
document.getElementById('restart-btn').addEventListener('click', startGame);

// Mobile controls
document.querySelectorAll('.mobile-btn').forEach(btn => {
  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const action = btn.dataset.action;
    if (!gameRunning || gamePaused) return;
    switch(action) {
      case 'left': move(-1, 0); break;
      case 'right': move(1, 0); break;
      case 'down': move(0, 1); score += SOFT_DROP_SCORE; updateDisplay(); break;
      case 'rotate': rotate(); break;
      case 'drop': hardDrop(); break;
      case 'hold': holdCurrentPiece(); break;
    }
  });
});

// ============ INITIAL RENDER ============
drawPreview(nextCtx, nextCanvas, nextPieces[0]);
drawBoard();
</script>
